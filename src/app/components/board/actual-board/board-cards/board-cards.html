
<div class="content" (click)="openDialog()">
  <div class="category">{{task.category}}</div>
  <div class="headline">{{task.headline}}</div>
  <p class="description">{{task.desc|shortenTextsnippets}}</p>

  <div class="progress-container">
  <div class="progress-bar">
    <div class="progress-fill" [style.width.%]="getPercentage()"></div>
  </div>
  <div>{{ getSubtaskStatus()}}</div>
  </div>
  <div class="footer">
    <div class="assigned-user-container">@for (contact of task.assignedTo; track contact.id) {
      <div class="mini-avatar"
           [style.background-color]="contact.color"
           [title]="contact.name">
        {{ getInitials(contact.name) }}
      </div>
    }</div>
    <div class="urgency-icon">
      @if (priorityMap[task.priority]) {
      <img [src]="'./assets/img/' + priorityMap[task.priority].icon" [alt]="priorityMap[task.priority].label">
      }
  </div>
  </div>
</div>
