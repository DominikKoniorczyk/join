<div class="content">


  <div class="column">
  <div class="first-col">
    <div class="col-header">
      <h3>To do</h3>
      <button class="add-btn"><svg viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M8 10.6667H0V8H8V0H10.6667V8H18.6667V10.6667H10.6667V18.6667H8V10.6667Z" fill="currentColor"/>
</svg></button>
    </div>
      <div class="task-column"><app-board-cards (cardOpened)="openDialog()"></app-board-cards></div>
  </div>
  </div>


  <div class="column">
  <div class="second-col">
    <div class="col-header">
      <h3>In progress</h3>
      <button class="add-btn"><svg viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M8 10.6667H0V8H8V0H10.6667V8H18.6667V10.6667H10.6667V18.6667H8V10.6667Z" fill="currentColor"/>
</svg></button>
    </div>
      <div class="task-column"></div>
  </div>
  </div>


  <div class="column">
  <div class="third-col">
    <div class="col-header">
      <h3>Await feedback</h3>
      <button class="add-btn"><svg viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M8 10.6667H0V8H8V0H10.6667V8H18.6667V10.6667H10.6667V18.6667H8V10.6667Z" fill="currentColor"/>
</svg></button>
    </div>
      <div class="task-column"></div>
  </div></div>

<div class="column">
  <div class="fourth-col">
    <div class="col-header">
      <h3>Done</h3>
    </div>
      <div class="task-column"></div>
  </div>
  </div>


</div>

<dialog #cardDialog><app-board-cards-full (closeTriggered)="closeDialog()"></app-board-cards-full></dialog>
