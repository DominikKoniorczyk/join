<div class="image_selector_outer">
  <div class="file-upload-container" #dropArea (drop)="handleDrop($event)" (dragover)="handleDragOver($event)" (dragleave)="handleDragLeave($event)">
    <input #fileInput type="file" accept=".jpeg, .png" multiple >
    <div class="visible_input" #uploadArea (click)="triggerFilePicker()">
      <p>Drag a file or browse</p>
    </div>
  </div>
</div>
