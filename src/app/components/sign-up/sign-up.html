<div class="signup-page">

  
  <div class="logo-container">
    <img src="assets/img/join-main-logo-dark.png" class="logo" />
  </div>

  <div class="signup-container">
    <form
      class="signup-form"
      #signupForm="ngForm"
      (ngSubmit)="onSubmit(signupForm)"
    >

     
      <button class="back-btn" type="button">
        ←
      </button>

     
      <div class="signup-header">
        <h1 class="signup-title">Sign up</h1>
        <div class="title-underline"></div>
      </div>

      
      <div class="signup-fields">

        
        <div class="input-group">
          <div class="input-field" [class.error]="nameInput.invalid && submitted">
            <input
              class="form-input"
              type="text"
              name="name"
              [(ngModel)]="name"
              required
              placeholder="Name"
              #nameInput="ngModel"
            />
          </div>
          <div class="error-message" *ngIf="nameInput.invalid && submitted">
            Name ist erforderlich
          </div>
        </div>

        
        <div class="input-group">
          <div class="input-field" [class.error]="emailInput.invalid && submitted">
            <input
              class="form-input"
              type="email"
              name="email"
              [(ngModel)]="email"
              required
              email
              placeholder="Email"
              #emailInput="ngModel"
            />
          </div>
          <div class="error-message" *ngIf="emailInput.invalid && submitted">
            Gültige Email erforderlich
          </div>
        </div>

        
        <div class="input-group">
          <div class="input-field" [class.error]="passwordInput.invalid && submitted">
            <input
              class="form-input"
              type="password"
              name="password"
              [(ngModel)]="password"
              required
              minlength="6"
              placeholder="Password"
              #passwordInput="ngModel"
            />
          </div>
          <div class="error-message" *ngIf="passwordInput.invalid && submitted">
            Mindestens 6 Zeichen
          </div>
        </div>

        
        <div class="input-group">
          <div class="input-field" [class.error]="showPasswordError && submitted">
            <input
              class="form-input"
              type="password"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              placeholder="Confirm Password"
            />
          </div>
          <div class="error-message" *ngIf="showPasswordError && submitted">
            Passwörter stimmen nicht überein
          </div>
        </div>

      </div>

      
      <div class="privacy-policy">
        <label class="checkbox-container">
          <input
            type="checkbox"
            name="policy"
            [(ngModel)]="acceptPolicy"
          />
          <span class="checkmark"></span>
          <span>
            Ich akzeptiere die
            <a href="#">Datenschutzbestimmungen</a>
          </span>
        </label>
      </div>

      <div class="error-message" *ngIf="!acceptPolicy && submitted">
        Bitte akzeptiere die Richtlinien
      </div>

      
      <button
        class="btn-primary"
        type="submit"
        [disabled]="!signupForm.valid || !acceptPolicy"
      >
        Sign Up
      </button>

    </form>
  </div>

  
  <div class="footer-links">
    <a href="#">Legal Notice</a>
    <a href="#">Privacy Policy</a>
  </div>

</div>
