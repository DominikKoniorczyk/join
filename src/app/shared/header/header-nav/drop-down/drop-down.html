<div class="circle" (click)="toggleDropdown()">
  <p class="initial-firstname">{{ currentUserName() | initialsSelector:1 }}</p>
  <p class="initial-lastname">{{ currentUserName() | initialsSelector:2 }}</p>
  <div class="dropdown" [class.show]="isDropDownOpen">
    <a routerLink="/legal-notice">Legal Notice</a><a routerLink="/privacy-policy">Privacy Policy</a
    ><a (click)="logOut()">Log Out</a><a class="mobile-help-btn" routerLink="/help">Help</a>
  </div>
</div>
